<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagase Ren 电子烧普册</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --main-black: #1a1a1a; --wish-red: #b83b5e; --bg-gray: #f4f4f9; }
        
        body { font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 20px; background: var(--bg-gray); color: #333; margin: 0; }
        
        /* 状态栏与控制区 */
        .controls { margin-bottom: 25px; background: #fff; padding: 15px; border-radius: 20px; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.05); sticky; top: 10px; z-index: 100; }
        select, button { padding: 10px 15px; margin: 5px; border-radius: 10px; border: 1px solid #ddd; font-size: 14px; cursor: pointer; transition: 0.3s; }
        button { background: var(--main-black); color: #fff; border: none; font-weight: bold; }
        button:hover { opacity: 0.8; transform: translateY(-1px); }
        
        /* 进度条 */
        #progressContainer { margin: 20px auto; max-width: 800px; display: none; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .progress-bar-bg { background: #e9ecef; border-radius: 10px; height: 12px; width: 100%; overflow: hidden; margin: 10px 0; }
        #progressBar { background: linear-gradient(90deg, #000, #444); height: 100%; width: 0%; transition: width 0.5s ease; }
        #progressStat { font-size: 13px; font-weight: bold; }

        /* 画廊布局 */
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 20px; min-height: 400px; }
        .photo-card { background: #fff; padding: 10px; border-radius: 12px; width: 220px; transition: 0.3s; position: relative; border: 1.5px solid #eee; }
        
        /* 核心样式：区分已拥有和缺失 */
        .archive-mode .photo-card.missing { opacity: 0.5; border: 1.5px dashed #ccc; box-shadow: none; }
        .photo-card { border: 2px solid var(--main-black); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        img { width: 100%; height: auto; border-radius: 6px; cursor: zoom-in; display: block; background: #eee; }
        
        .card-footer { margin-top: 10px; font-size: 12px; border-top: 1px solid #f0f0f0; padding-top: 8px; }
        .note-input { width: 90%; padding: 5px; border: 1px solid #eee; border-radius: 4px; font-size: 11px; margin-top: 5px; }

        /* 导出时的隐藏处理 */
        .exporting .checkbox-container, .exporting button, .exporting .note-input::placeholder { display: none !important; }
        .exporting .note-input { border: none !important; text-align: center; }

        /* 模态框 */
        .modal { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        .modal-content { max-width: 95%; max-height: 95%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid #fff; }

        .watermark { margin-top: 50px; color: #aaa; font-size: 12px; padding-bottom: 30px; }
    </style>
</head>
<body>

    <h1 style="letter-spacing: 2px;">🖤 NAGASE REN <span id="modeTitle">ARCHIVE</span></h1>

    <div class="controls">
        <select id="yearSelect"><option value="">📅 年份...</option></select>
        <select id="singleSelect"><option value="">💿 分类...</option></select>
        <button onclick="showCollected()">💖 已拥有</button>
        <button onclick="showWishlist()" style="background:var(--wish-red);">🛒 愿望清单</button>
        <button onclick="exportToImage()" style="background:#28a745;">📸 导出长图</button>
        <button onclick="location.reload()" style="background:#6c757d;">🔄 重置</button>
    </div>

    <div id="progressContainer">
        <h3 id="currentCategoryTitle" style="margin:0 0 10px 0;"></h3>
        <div class="progress-bar-bg"><div id="progressBar"></div></div>
        <p id="progressStat">0 / 0 (0%)</p>
        <label style="font-size: 13px; cursor: pointer;">
            <input type="checkbox" id="selectAllTrigger" onchange="toggleSelectAll(this)"> 全选本组
        </label>
    </div>

    <div id="gallery" class="gallery">
        </div>

    <div class="watermark">
        Nagase Ren Photo Archive | © 2026 Created by yll19990123 非经许可请勿转载
    </div>

    <div id="myModal" class="modal" onclick="this.style.display='none'">
        <img class="modal-content" id="imgFull">
    </div>

    <script>
        let photoData = {};
        let myFavs = JSON.parse(localStorage.getItem('ren_nagase_collection')) || [];
        let myNotes = JSON.parse(localStorage.getItem('ren_nagase_notes')) || {};
        let currentMode = 'archive'; // archive, collected, wishlist

        const yearSelect = document.getElementById('yearSelect');
        const singleSelect = document.getElementById('singleSelect');
        const gallery = document.getElementById('gallery');
        const progressContainer = document.getElementById('progressContainer');

        // 初始化：获取数据
        window.onload = () => {
            fetch('data.json?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    photoData = data;
                    Object.keys(data).sort((a, b) => b - a).forEach(year => {
                        yearSelect.appendChild(new Option(year + " 年", year));
                    });
                })
                .catch(err => alert("无法加载 data.json，请检查文件是否存在且格式正确。"));
        };

        // 核心渲染函数
        function render(urls, mode) {
            currentMode = mode;
            gallery.innerHTML = '';
            gallery.className = 'gallery ' + (mode === 'archive' ? 'archive-mode' : '');
            
            if (!urls || urls.length === 0) {
                gallery.innerHTML = `<div style="padding:100px; color:#999;">这里还没有照片哦~</div>`;
                return;
            }

            urls.forEach(url => {
                const isSaved = myFavs.includes(url);
                // 模式过滤
                if (mode === 'collected' && !isSaved) return;
                if (mode === 'wishlist' && isSaved) return;

                const card = document.createElement('div');
                card.className = `photo-card ${isSaved ? '' : 'missing'}`;
                const note = myNotes[url] || "";

                let footer = '';
                if (mode === 'archive') {
                    footer = `
                        <div class="checkbox-container">
                            <input type="checkbox" ${isSaved ? 'checked' : ''} onchange="toggleSave('${url}', this)"> 已入库
                        </div>`;
                } else if (mode === 'wishlist') {
                    footer = `<button onclick="quickCollect('${url}')" style="font-size:10px; padding:4px 8px;">标记入库</button>`;
                } else {
                    footer = `<span style="color:#28a745">✔ OWNED</span>`;
                }

                card.innerHTML = `
                    <img src="${url}" loading="lazy" onclick="openModal('${url}')" onerror="this.src='https://via.placeholder.com/200x280?text=Image+Missing'">
                    <div class="card-footer">
                        ${footer}
                        <input type="text" class="note-input" placeholder="添加备注..." value="${note}" onchange="saveNote('${url}', this.value)">
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        // 勾选保存逻辑
        function toggleSave(url, checkbox) {
            if (checkbox.checked) {
                if (!myFavs.includes(url)) myFavs.push(url);
                checkbox.closest('.photo-card').classList.remove('missing');
            } else {
                myFavs = myFavs.filter(i => i !== url);
                checkbox.closest('.photo-card').classList.add('missing');
            }
            saveToLocal();
            refreshProgress();
        }

        function quickCollect(url) {
            if (!myFavs.includes(url)) myFavs.push(url);
            saveToLocal();
            confetti({ particleCount: 40, spread: 50, origin: { y: 0.8 } });
            showWishlist(); 
        }

        function saveNote(url, text) {
            myNotes[url] = text;
            saveToLocal();
        }

        function saveToLocal() {
            localStorage.setItem('ren_nagase_collection', JSON.stringify(myFavs));
            localStorage.setItem('ren_nagase_notes', JSON.stringify(myNotes));
        }

        // 进度与下拉框联动
        function refreshProgress() {
            const year = yearSelect.value;
            const cat = singleSelect.value;
            if (!year || !cat) return;

            const urls = photoData[year][cat];
            const total = urls.length;
            const owned = urls.filter(u => myFavs.includes(u)).length;
            const percent = Math.round((owned / total) * 100);

            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressStat').innerText = `${owned} / ${total} (${percent}%)`;
            
            // 更新下拉框里的数字
            const options = singleSelect.options;
            for (let opt of options) {
                if (opt.value === cat) {
                    opt.text = `${cat} (${owned}/${total})`;
                }
            }

            if (percent === 100) confetti({ particleCount: 100, spread: 70 });
        }

        // 切换年份
        yearSelect.onchange = function() {
            singleSelect.innerHTML = '<option value="">💿 选择分类</option>';
            if (!this.value) return;
            Object.keys(photoData[this.value]).forEach(cat => {
                const urls = photoData[this.value][cat];
                const owned = urls.filter(u => myFavs.includes(u)).length;
                singleSelect.appendChild(new Option(`${cat} (${owned}/${urls.length})`, cat));
            });
        };

        // 切换分类
        singleSelect.onchange = function() {
            if (!this.value) return;
            document.getElementById('modeTitle').innerText = "ARCHIVE";
            progressContainer.style.display = 'block';
            document.getElementById('currentCategoryTitle').innerText = this.value;
            const urls = photoData[yearSelect.value][this.value];
            render(urls, 'archive');
            refreshProgress();
            document.getElementById('selectAllTrigger').checked = urls.every(u => myFavs.includes(u));
        };

        function toggleSelectAll(trigger) {
            const urls = photoData[yearSelect.value][singleSelect.value];
            if (trigger.checked) {
                urls.forEach(u => { if(!myFavs.includes(u)) myFavs.push(u); });
            } else {
                myFavs = myFavs.filter(u => !urls.includes(u));
            }
            saveToLocal();
            render(urls, 'archive');
            refreshProgress();
        }

        function showCollected() {
            document.getElementById('modeTitle').innerText = "COLLECTED";
            progressContainer.style.display = 'none';
            render(myFavs, 'collected');
        }

        function showWishlist() {
            document.getElementById('modeTitle').innerText = "WISHLIST";
            progressContainer.style.display = 'none';
            let allUrls = [];
            Object.values(photoData).forEach(y => Object.values(y).forEach(list => allUrls = allUrls.concat(list)));
            const wishlist = allUrls.filter(u => !myFavs.includes(u));
            render(wishlist, 'wishlist');
        }

        function openModal(url) {
            document.getElementById('myModal').style.display = "block";
            document.getElementById('imgFull').src = url;
        }

        // 导出长图
        function exportToImage() {
            const btn = document.querySelector('button[onclick="exportToImage()"]');
            btn.innerText = "正在生成...";
            btn.disabled = true;
            
            gallery.classList.add('exporting');
            
            // 确保图片加载完成
            const imgs = gallery.querySelectorAll('img');
            const promises = Array.from(imgs).map(i => new Promise(res => { if(i.complete) res(); else i.onload=res; i.onerror=res; }));

            Promise.all(promises).then(() => {
                html2canvas(gallery, {
                    useCORS: true,
                    scale: 2,
                    backgroundColor: "#f4f4f9"
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `Nagase_Ren_Archive_${new Date().getTime()}.jpg`;
                    link.href = canvas.toDataURL("image/jpeg", 0.9);
                    link.click();
                    
                    gallery.classList.remove('exporting');
                    btn.innerText = "📸 导出长图";
                    btn.disabled = false;
                });
            });
        }
    </script>
</body>
</html>
