<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Ren Nagase 专属轨迹图鉴</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #fafafa; color: #333; }
        .controls { margin-bottom: 30px; background: #fff; padding: 20px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        select, button { padding: 12px; margin: 5px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px; cursor: pointer; }
        button { background: #000; color: white; border: none; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .photo-card { background: white; padding: 10px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); width: 260px; position: relative; }
        img { width: 100%; height: auto; border-radius: 8px; cursor: zoom-in; }
        .check-area { margin-top: 10px; font-size: 14px; border-top: 1px solid #eee; padding-top: 8px; }
        /* 放大模态框 */
        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 90%; position: relative; top: 50%; transform: translateY(-50%); }
    </style>
</head>
<body>
    <h1>🖤 Ren Nagase 个人图鉴收藏</h1>
   <div class="controls">
        <select id="yearSelect"><option value="">加载中...</option></select>
        <select id="singleSelect"><option value="">选择分类</option></select>
        <button onclick="filterMyCollection()">💎 查看收藏</button>
        <button onclick="exportToImage()" style="background:#b83b5e;">📸 保存图鉴</button>
        <button onclick="location.reload()" style="background:#6c757d; color:#fff;">显示全部</button>
    </div>
  <div id="progressContainer" style="margin: 20px auto; max-width: 800px; display: none;">
    <h2 id="currentCategoryTitle" style="margin-bottom: 5px;"></h2>
    <div style="background: #eee; border-radius: 10px; height: 20px; width: 100%; position: relative; overflow: hidden;">
        <div id="progressBar" style="background: #b83b5e; height: 100%; width: 0%; transition: width 0.3s;"></div>
    </div>
    <p id="progressStat" style="margin-top: 5px; font-weight: bold;"></p>
</div>

  <script>
    let photoData = {};
    let myFavs = JSON.parse(localStorage.getItem('ren_nagase_collection')) || [];
    const yearSelect = document.getElementById('yearSelect');
    const singleSelect = document.getElementById('singleSelect');
    const gallery = document.getElementById('gallery');
    const statusText = document.getElementById('statusText');
    const progressContainer = document.getElementById('progressContainer');

    // 1. 获取并初始化数据
    fetch('data.json?t=' + Date.now())
        .then(res => {
            if (!res.ok) throw new Error('Data not found');
            return res.json();
        })
        .then(data => {
            photoData = data;
            yearSelect.innerHTML = '<option value="">选择年份</option>';
            Object.keys(data).sort((a, b) => b - a).forEach(year => {
                yearSelect.appendChild(new Option(year + "年", year));
            });
        })
        .catch(err => console.error("加载失败:", err));

    // 2. 年份切换逻辑
    yearSelect.onchange = function() {
        singleSelect.innerHTML = '<option value="">选择分类</option>';
        if (this.value && photoData[this.value]) {
            Object.keys(photoData[this.value]).forEach(s => {
                singleSelect.appendChild(new Option(s, s));
            });
        }
        progressContainer.style.display = 'none'; // 切换年份时先隐藏进度
        gallery.innerHTML = ''; 
    };

    // 3. 分类切换逻辑
    singleSelect.onchange = function() {
        if (this.value && yearSelect.value) {
            render(photoData[yearSelect.value][this.value]);
        }
    };

    // 4. 核心渲染函数 (含进度计算)
    function render(urls) {
        gallery.innerHTML = '';
        if (!urls || urls.length === 0) {
            progressContainer.style.display = 'none';
            gallery.innerHTML = '<p>暂无照片</p>';
            return;
        }

        // 显示并更新进度条
        progressContainer.style.display = 'block';
        const selectedYear = yearSelect.value;
        const selectedSingle = singleSelect.value;
        document.getElementById('currentCategoryTitle').innerText = 
            selectedYear ? `${selectedYear}年 ➔ ${selectedSingle}` : "我的收藏全集";

        updateProgressUI(urls);

        // 循环生成图片卡片
        urls.forEach(url => {
            const isSaved = myFavs.includes(url);
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.innerHTML = `
                <img src="${url}" loading="lazy" onclick="openModal('${url}')" onerror="this.src='https://via.placeholder.com/260?text=图片路径有误'">
                <div class="check-area">
                    <input type="checkbox" ${isSaved ? 'checked' : ''} onchange="toggleSave('${url}', this)"> 确认收集
                </div>`;
            gallery.appendChild(card);
        });
    }

    // 5. 更新进度条 UI 的小工具
    function updateProgressUI(urls) {
        const total = urls.length;
        const collectedCount = urls.filter(url => myFavs.includes(url)).length;
        const percent = total > 0 ? (collectedCount / total) * 100 : 0;
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('progressStat').innerText = `已收集 ${collectedCount} / ${total}`;
        
        // 全收集特效触发点
        if (percent === 100 && total > 0) {
            document.getElementById('progressStat').innerHTML += " 🎊 全系列达成！";
        }
    }

    // 6. 勾选收藏逻辑
    function toggleSave(url, cb) {
        if (cb.checked) {
            if (!myFavs.includes(url)) myFavs.push(url);
        } else {
            myFavs = myFavs.filter(i => i !== url);
        }
        localStorage.setItem('ren_nagase_collection', JSON.stringify(myFavs));

        // 实时刷新当前分类的进度
        const currentUrls = (yearSelect.value && singleSelect.value) ? 
                           photoData[yearSelect.value][singleSelect.value] : myFavs;
        updateProgressUI(currentUrls);
    }

    // 7. 其他功能 (弹窗、导出、过滤)
    function openModal(url) { 
        document.getElementById('myModal').style.display = "block"; 
        document.getElementById('imgFull').src = url; 
    }
    
    function filterMyCollection() { 
        render(myFavs);
        document.getElementById('currentCategoryTitle').innerText = "✨ 我的专属收藏全集";
    }

    function exportToImage() {
        html2canvas(gallery, { useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'My_Ren_Nagase_Collection.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>
</body>
</html>
