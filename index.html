<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Ren Nagase 搜集手册 v4.2</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 20px; background: #f8f9fa; color: #333; }
        .controls { margin-bottom: 25px; background: #fff; padding: 20px; border-radius: 20px; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        select, button { padding: 12px 18px; margin: 6px; border-radius: 10px; border: 1px solid #ddd; font-size: 14px; cursor: pointer; transition: 0.3s; }
        button { background: #000; color: #fff; border: none; font-weight: bold; }
        button:hover { background: #333; transform: translateY(-2px); }
        
        #progressContainer { margin: 20px auto; max-width: 850px; display: none; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .progress-bar-bg { background: #e9ecef; border-radius: 10px; height: 14px; width: 100%; overflow: hidden; margin: 12px 0; }
        #progressBar { background: linear-gradient(90deg, #212529, #495057); height: 100%; width: 0%; transition: width 0.6s ease; }
        #progressStat { font-weight: bold; color: #212529; font-size: 15px; }

        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .photo-card { background: #fff; padding: 12px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); width: 250px; transition: 0.3s; }
        
        .archive-mode .photo-card.missing { opacity: 0.45; filter: grayscale(1); border: 1px dashed #adb5bd; }
        .photo-card { opacity: 1; filter: grayscale(0); }

        img { width: 100%; height: auto; border-radius: 8px; cursor: zoom-in; }
        .card-footer { margin-top: 12px; border-top: 1px solid #eee; padding-top: 10px; }
        .check-area { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold; font-size: 13px; margin-bottom: 8px; }
        .note-input { width: 90%; padding: 6px; border: 1px solid #eee; border-radius: 5px; font-size: 12px; outline: none; }

        .modal { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 90%; position: relative; top: 50%; transform: translateY(-50%); border: 2px solid #fff; }
    </style>
</head>
<body>

    <h1 style="font-weight: 900; letter-spacing: 1px;">🖤 NAGASE REN <span id="modeTitle">ARCHIVE</span></h1>

    <div class="controls">
        <select id="yearSelect"><option value="">📅 年代...</option></select>
        <select id="singleSelect"><option value="">💿 分类...</option></select>
        <button onclick="showCollected()" style="background:#000;">💖 已拥有</button>
        <button onclick="showWishlist()" style="background:#b83b5e;">🛒 愿望清单</button>
        <button onclick="exportToImage()">📸 导出当前</button>
        <button onclick="location.reload()" style="background:#6c757d;">🔄 重置</button>
    </div>

    <div id="progressContainer">
        <h2 id="currentCategoryTitle" style="margin: 0; font-size: 1.25rem;"></h2>
        <div class="progress-bar-bg"><div id="progressBar"></div></div>
        <p id="progressStat"></p>
        <div id="selectAllArea" style="margin-top:10px;">
            <input type="checkbox" id="selectAllTrigger" onchange="toggleSelectAll(this)"> 
            <label for="selectAllTrigger" style="cursor: pointer; font-weight: bold;">全选本页</label>
        </div>
    </div>

    <div class="gallery" id="gallery"></div>

    <div id="myModal" class="modal" onclick="this.style.display='none'"><img class="modal-content" id="imgFull"></div>

    <script>
        let photoData = {};
        let myFavs = JSON.parse(localStorage.getItem('ren_nagase_collection')) || [];
        let myNotes = JSON.parse(localStorage.getItem('ren_nagase_notes')) || {};
        
        const yearSelect = document.getElementById('yearSelect');
        const singleSelect = document.getElementById('singleSelect');
        const gallery = document.getElementById('gallery');
        const progressContainer = document.getElementById('progressContainer');

        window.onload = () => {
            fetch('data.json?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    photoData = data;
                    yearSelect.innerHTML = '<option value="">📅 选择年份</option>';
                    Object.keys(data).sort((a, b) => b - a).forEach(year => {
                        yearSelect.appendChild(new Option(year + " 年", year));
                    });
                });
        };

       function render(urls, mode = 'archive') {
            gallery.innerHTML = '';
            // 只有在分类浏览模式下才开启灰度样式
            gallery.className = 'gallery ' + (mode === 'archive' ? 'archive-mode' : '');
            
            if (!urls || urls.length === 0) {
                gallery.innerHTML = `<p>${mode === 'wishlist' ? '太棒了！愿望清单已清空！' : '这里空空如也~'}</p>`;
                return;
            }

            urls.forEach(url => {
                const isSaved = myFavs.includes(url);
                // 模式过滤
                if (mode === 'collected' && !isSaved) return;
                if (mode === 'wishlist' && isSaved) return;

                const card = document.createElement('div');
                card.className = `photo-card ${isSaved ? '' : 'missing'}`;
                const note = myNotes[url] || "";

                // 根据模式决定底部显示内容
                let footerContent = '';
                if (mode === 'archive') {
                    // 分类浏览模式：显示复选框和备注
                    footerContent = `
                        <div class="check-area">
                            <input type="checkbox" ${isSaved ? 'checked' : ''} onchange="toggleSave('${url}', this, '${mode}')"> 已收藏
                        </div>
                        <input type="text" class="note-input" placeholder="添加备注..." value="${note}" onchange="saveNote('${url}', this.value)">`;
                } else if (mode === 'wishlist') {
                    // 愿望清单模式：不显示复选框，显示“🛒 想要”字样和备注
                    footerContent = `
                        <div style="color: #b83b5e; font-weight: bold; margin-bottom: 8px;">🛒 想要入手</div>
                        <input type="text" class="note-input" placeholder="备注：如价格、渠道" value="${note}" onchange="saveNote('${url}', this.value)">
                        <div style="margin-top: 10px;"><button onclick="quickCollect('${url}')" style="padding: 5px 10px; font-size: 11px; background: #000;">标记为已入库</button></div>`;
                } else if (mode === 'collected') {
                    // 已拥有模式：不显示复选框，仅显示备注，保持极致纯净
                    footerContent = `
                        <div style="color: #212529; font-weight: bold; margin-bottom: 8px;">💖 已入库</div>
                        <input type="text" class="note-input" placeholder="备注..." value="${note}" onchange="saveNote('${url}', this.value)">`;
                }

                card.innerHTML = `
                    <img src="${url}" loading="lazy" onclick="openModal('${url}')">
                    <div class="card-footer">${footerContent}</div>`;
                gallery.appendChild(card);
            });
        }

        // 愿望清单模式下的快速入库功能
        function quickCollect(url) {
            if (!myFavs.includes(url)) {
                myFavs.push(url);
                localStorage.setItem('ren_nagase_collection', JSON.stringify(myFavs));
                showWishlist(); // 刷新愿望清单，该图会自动消失
                confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
            }
        }

        function toggleSave(url, cb, mode) {
            const card = cb.closest('.photo-card');
            if (cb.checked) {
                if (!myFavs.includes(url)) myFavs.push(url);
                card.classList.remove('missing');
            } else {
                myFavs = myFavs.filter(i => i !== url);
                if (mode === 'archive') card.classList.add('missing');
            }
            localStorage.setItem('ren_nagase_collection', JSON.stringify(myFavs));
            
            if (mode === 'collected' || mode === 'wishlist') {
                setTimeout(() => renderByCurrentMode(mode), 300);
            } else {
                const currentUrls = photoData[yearSelect.value][singleSelect.value];
                updateProgress(currentUrls);
                refreshSingleDropdown(yearSelect.value);
                checkSelectAllStatus(currentUrls);
            }
        }

        // --- 核心修复：全选即刻同步进度条 ---
        function toggleSelectAll(trigger) {
            const year = yearSelect.value;
            const single = singleSelect.value;
            if (!year || !single) return;
            const currentUrls = photoData[year][single];

            if (trigger.checked) {
                currentUrls.forEach(url => { if (!myFavs.includes(url)) myFavs.push(url); });
            } else {
                myFavs = myFavs.filter(url => !currentUrls.includes(url));
            }
            
            localStorage.setItem('ren_nagase_collection', JSON.stringify(myFavs));
            
            // 立即刷新 UI
            render(currentUrls, 'archive');
            updateProgress(currentUrls);
            refreshSingleDropdown(year);
        }

        function saveNote(url, text) {
            myNotes[url] = text;
            localStorage.setItem('ren_nagase_notes', JSON.stringify(myNotes));
        }

        function showCollected() {
            yearSelect.value = ""; singleSelect.innerHTML = '<option value="">已入库清单</option>';
            progressContainer.style.display = 'none';
            document.getElementById('modeTitle').innerText = "COLLECTED";
            render(myFavs, 'collected');
        }

        function showWishlist() {
            yearSelect.value = ""; singleSelect.innerHTML = '<option value="">愿望清单</option>';
            progressContainer.style.display = 'none';
            document.getElementById('modeTitle').innerText = "WISHLIST";
            let allUrls = [];
            Object.values(photoData).forEach(y => Object.values(y).forEach(u => allUrls = allUrls.concat(u)));
            const wishlist = allUrls.filter(u => !myFavs.includes(u));
            render(wishlist, 'wishlist');
        }

        singleSelect.onchange = function() {
            if (this.value && yearSelect.value) {
                progressContainer.style.display = 'block';
                document.getElementById('modeTitle').innerText = "ARCHIVE";
                document.getElementById('currentCategoryTitle').innerText = `${yearSelect.value} • ${this.value}`;
                const urls = photoData[yearSelect.value][this.value];
                updateProgress(urls);
                render(urls, 'archive');
                checkSelectAllStatus(urls);
            }
        };

        function updateProgress(urls) {
            const total = urls.length;
            const collectedCount = urls.filter(url => myFavs.includes(url)).length;
            const percent = total > 0 ? (collectedCount / total) * 100 : 0;
            
            const pBar = document.getElementById('progressBar');
            const pStat = document.getElementById('progressStat');
            
            if(pBar) pBar.style.width = percent + '%';
            if(pStat) pStat.innerText = `本组进度：${collectedCount} / ${total} (${Math.round(percent)}%)`;
            
            if (percent === 100 && total > 0) confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }

        yearSelect.onchange = function() {
            singleSelect.innerHTML = '<option value="">💿 选择分类</option>';
            if (this.value) refreshSingleDropdown(this.value);
        };

        function refreshSingleDropdown(year) {
            const current = singleSelect.value;
            singleSelect.innerHTML = '<option value="">💿 选择分类</option>';
            Object.keys(photoData[year]).forEach(s => {
                const mine = photoData[year][s].filter(url => myFavs.includes(url)).length;
                const total = photoData[year][s].length;
                singleSelect.appendChild(new Option(`${s} (${mine}/${total})`, s));
            });
            singleSelect.value = current;
        }

        function checkSelectAllStatus(urls) {
            const trigger = document.getElementById('selectAllTrigger');
            if (trigger) trigger.checked = urls.every(url => myFavs.includes(url)) && urls.length > 0;
        }

        function openModal(url) { document.getElementById('myModal').style.display = "block"; document.getElementById('imgFull').src = url; }
        
        function exportToImage() {
            const btn = document.querySelector('button[onclick="exportToImage()"]');
            const originalText = btn.innerText;
            btn.innerText = "正在生成高清图 (请稍候)...";
            btn.disabled = true;

            // 核心修复：强制让所有图片加载完成后再执行导出
            const images = gallery.getElementsByTagName('img');
            const promises = Array.from(images).map(img => {
                if (img.complete) return Promise.resolve();
                return new Promise(resolve => {
                    img.onload = resolve;
                    img.onerror = resolve;
                });
            });

            Promise.all(promises).then(() => {
                // 使用更高的 scale (3.0) 确保备注文字也清晰
                html2canvas(gallery, {
                    useCORS: true,           // 允许跨域图片渲染
                    backgroundColor: "#f8f9fa",
                    scale: 3,               // 提高清晰度
                    logging: false,          // 关闭调试日志
                    windowWidth: gallery.scrollWidth,
                    windowHeight: gallery.scrollHeight
                }).then(canvas => {
                    const link = document.createElement('a');
                    const fileName = document.getElementById('modeTitle').innerText;
                    link.download = `Ren_Nagase_${fileName}_${new Date().toISOString().slice(0,10)}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                    
                    btn.innerText = originalText;
                    btn.disabled = false;
                });
            });
        }
    </script>
</body>
</html>
