<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Ren Nagase 永濑廉搜集手册 v3.0</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 20px; background: #f8f9fa; color: #333; }
        .controls { margin-bottom: 25px; background: #fff; padding: 25px; border-radius: 20px; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        select, button { padding: 12px 18px; margin: 6px; border-radius: 10px; border: 1px solid #ddd; font-size: 14px; cursor: pointer; transition: 0.3s; }
        button { background: #000; color: #fff; border: none; font-weight: bold; }
        button:hover { background: #333; transform: translateY(-2px); }
        
        /* 进度面板 */
        #progressContainer { margin: 20px auto; max-width: 850px; display: none; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .progress-bar-bg { background: #e9ecef; border-radius: 10px; height: 14px; width: 100%; overflow: hidden; margin: 12px 0; }
        #progressBar { background: linear-gradient(90deg, #212529, #495057); height: 100%; width: 0%; transition: width 0.6s ease; }
        #progressStat { font-weight: bold; color: #212529; font-size: 15px; }

        /* 照片卡片 */
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .photo-card { background: #fff; padding: 12px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); width: 250px; position: relative; transition: 0.3s; }
        
        /* 默认待解锁状态 */
        .photo-card.missing { opacity: 0.45; filter: grayscale(1); border: 1px dashed #adb5bd; }
        .photo-card.missing::after { content: "未持有"; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; z-index: 2; pointer-events: none; }

        /* 愿望清单高亮模式 */
        .wishlist-active .photo-card.missing { opacity: 1 !important; filter: grayscale(0) !important; border: 2.5px solid #b83b5e !important; box-shadow: 0 0 15px rgba(184, 59, 94, 0.3); }
        .wishlist-active .photo-card.missing::after { content: "🛒 愿望清单" !important; background: #b83b5e !important; }

        img { width: 100%; height: auto; border-radius: 8px; cursor: zoom-in; }
        .check-area { margin-top: 12px; border-top: 1px solid #eee; padding-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold; font-size: 13px; }

        .modal { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 90%; position: relative; top: 50%; transform: translateY(-50%); border: 2px solid #fff; }
    </style>
</head>
<body>

    <h1 style="font-weight: 900; letter-spacing: 1px;">🖤 NAGASE REN <span id="modeTitle">ARCHIVE</span></h1>

    <div class="controls">
        <select id="yearSelect"><option value="">📅 选择年份...</option></select>
        <select id="singleSelect"><option value="">💿 选择主题</option></select>
        <button onclick="filterMyCollection()" style="background:#000;">💖 已入库</button>
        <button onclick="toggleWishlistMode()" id="wishBtn" style="background:#b83b5e;">🛒 愿望清单</button>
        <button onclick="exportToImage()">📸 导出当前视图</button>
        <button onclick="location.reload()" style="background:#6c757d;">🔄 重置</button>
    </div>

    <div id="progressContainer">
        <h2 id="currentCategoryTitle" style="margin: 0; font-size: 1.25rem;"></h2>
        <div class="progress-bar-bg"><div id="progressBar"></div></div>
        <p id="progressStat"></p>
        <div id="selectAllArea" style="margin-top:10px;">
            <input type="checkbox" id="selectAllTrigger" onchange="toggleSelectAll(this)"> 
            <label for="selectAllTrigger" style="cursor: pointer; font-weight: bold;">全选本页</label>
        </div>
    </div>

    <div class="gallery" id="gallery"></div>

    <div id="myModal" class="modal" onclick="this.style.display='none'"><img class="modal-content" id="imgFull"></div>

    <script>
        let photoData = {};
        let myFavs = JSON.parse(localStorage.getItem('ren_nagase_collection')) || [];
        let isWishlistMode = false;
        
        const yearSelect = document.getElementById('yearSelect');
        const singleSelect = document.getElementById('singleSelect');
        const gallery = document.getElementById('gallery');
        const progressContainer = document.getElementById('progressContainer');

        window.onload = () => {
            fetch('data.json?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    photoData = data;
                    yearSelect.innerHTML = '<option value="">📅 选择年份</option>';
                    Object.keys(data).sort((a, b) => b - a).forEach(year => {
                        yearSelect.appendChild(new Option(year + " 年", year));
                    });
                });
        };

        // 切换“愿望清单”模式：让未入库的照片亮起
        function toggleWishlistMode() {
            isWishlistMode = !isWishlistMode;
            const btn = document.getElementById('wishBtn');
            if (isWishlistMode) {
                gallery.classList.add('wishlist-active');
                btn.innerText = "🖼️ 返回标准视图";
                btn.style.background = "#212529";
            } else {
                gallery.classList.remove('wishlist-active');
                btn.innerText = "🛒 愿望清单";
                btn.style.background = "#b83b5e";
            }
            // 保持当前内容，只刷新状态
            if (yearSelect.value && singleSelect.value) {
                render(photoData[yearSelect.value][singleSelect.value]);
            }
        }

        yearSelect.onchange = function() {
            singleSelect.innerHTML = '<option value="">💿 选择主题</option>';
            gallery.innerHTML = '';
            progressContainer.style.display = 'none';
            if (this.value) refreshSingleDropdown(this.value);
        };

        singleSelect.onchange = function() {
            if (this.value && yearSelect.value) render(photoData[yearSelect.value][this.value]);
        };

        function render(urls) {
            gallery.innerHTML = '';
            if (!urls || urls.length === 0) {
                progressContainer.style.display = 'none';
                return;
            }

            progressContainer.style.display = 'block';
            document.getElementById('currentCategoryTitle').innerText = `${yearSelect.value} • ${singleSelect.value}`;

            updateProgress(urls);

            urls.forEach(url => {
                const isSaved = myFavs.includes(url);
                const card = document.createElement('div');
                card.className = `photo-card ${isSaved ? '' : 'missing'}`;
                card.innerHTML = `
                    <img src="${url}" loading="lazy" onclick="openModal('${url}')" onerror="this.src='https://via.placeholder.com/250x330?text=未上传'">
                    <div class="check-area">
                        <input type="checkbox" ${isSaved ? 'checked' : ''} onchange="toggleSave('${url}', this)"> 已入库
                    </div>`;
                gallery.appendChild(card);
            });
            checkSelectAllStatus(urls);
        }

        function updateProgress(urls) {
            const total = urls.length;
            const collectedCount = urls.filter(url => myFavs.includes(url)).length;
            const percent = total > 0 ? (collectedCount / total) * 100 : 0;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressStat').innerText = `本组进度：${collectedCount} / ${total} (${Math.round(percent)}%)`;
            if (percent === 100 && total > 0) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        function toggleSave(url, cb) {
            if (cb.checked) {
                if (!myFavs.includes(url)) myFavs.push(url);
                cb.parentElement.parentElement.classList.remove('missing');
            } else {
                myFavs = myFavs.filter(i => i !== url);
                cb.parentElement.parentElement.classList.add('missing');
            }
            localStorage.setItem('ren_nagase_collection', JSON.stringify(myFavs));
            
            const currentUrls = photoData[yearSelect.value][singleSelect.value];
            updateProgress(currentUrls);
            refreshSingleDropdown(yearSelect.value);
            checkSelectAllStatus(currentUrls);
        }

        function toggleSelectAll(trigger) {
            const urls = photoData[yearSelect.value][singleSelect.value];
            if (trigger.checked) {
                urls.forEach(url => { if (!myFavs.includes(url)) myFavs.push(url); });
            } else {
                myFavs = myFavs.filter(url => !urls.includes(url));
            }
            localStorage.setItem('ren_nagase_collection', JSON.stringify(myFavs));
            render(urls);
            refreshSingleDropdown(yearSelect.value);
        }

        function refreshSingleDropdown(year) {
            const current = singleSelect.value;
            singleSelect.innerHTML = '<option value="">💿 选择主题</option>';
            Object.keys(photoData[year]).forEach(s => {
                const mine = photoData[year][s].filter(url => myFavs.includes(url)).length;
                const total = photoData[year][s].length;
                const opt = new Option(`${s} (${mine}/${total})`, s);
                if (s === current) opt.selected = true;
                singleSelect.appendChild(opt);
            });
        }

        function checkSelectAllStatus(urls) {
            const trigger = document.getElementById('selectAllTrigger');
            trigger.checked = urls.every(url => myFavs.includes(url)) && urls.length > 0;
        }

        function filterMyCollection() {
            gallery.classList.remove('wishlist-active');
            isWishlistMode = false;
            document.getElementById('wishBtn').innerText = "🛒 愿望清单";
            gallery.innerHTML = '';
            myFavs.forEach(url => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `<img src="${url}" onclick="openModal('${url}')">`;
                gallery.appendChild(card);
            });
            progressContainer.style.display = 'none';
            document.getElementById('modeTitle').innerText = "MY COLLECTION";
        }

        function openModal(url) { document.getElementById('myModal').style.display = "block"; document.getElementById('imgFull').src = url; }
        
        function exportToImage() {
            html2canvas(gallery, { useCORS: true, backgroundColor: "#f8f9fa", scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Nagase_Ren_List.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
